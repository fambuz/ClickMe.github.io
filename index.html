<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>I Love You Animation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #fceeb5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }
    .wrapper {
      position: relative;
      width: 700px;
      height: 250px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    svg {
      width: 100%;
      height: 100%;
    }
    .bar {
      fill: #763c8c;
    }
    .text-fill {
      fill: #763c8c;
      font-size: 58px;
      font-weight: 900;
      dominant-baseline: central;
    }
    .heart-fill {
      fill: #fa4843;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

<div class="wrapper">
  <svg viewBox="0 0 700 250">
    <defs>
      <!-- Left Clip Box (Grows inwards to hide LOVE) -->
      <clipPath id="clip-love">
        <rect id="rect-love" x="200" y="0" width="150" height="250" />
      </clipPath>
      <!-- Right Clip Box (Grows inwards to hide YO) -->
      <clipPath id="clip-yo">
        <rect id="rect-yo" x="350" y="0" width="150" height="250" />
      </clipPath>
    </defs>

    <!-- Side Bars -->
    <rect id="barL" class="bar" x="90" y="80" width="6" height="90" rx="3" />
    <rect id="barR" class="bar" x="604" y="80" width="6" height="90" rx="3" />

    <!-- Static Anchors: I and U -->
    <text id="textI" class="text-fill" x="120" y="125" text-anchor="start">I</text>
    <text id="textU" class="text-fill" x="580" y="125" text-anchor="end">U</text>

    <!-- Squeezing Text Blocks (Masked) -->
    <g clip-path="url(#clip-love)">
      <text id="textLove" class="text-fill" x="200" y="125" text-anchor="start">LOVE</text>
    </g>
    <g clip-path="url(#clip-yo)">
      <text id="textYo" class="text-fill" x="490" y="125" text-anchor="end">YO</text>
    </g>

    <!-- Center Heart -->
    <path id="heart" class="heart-fill" d="M350,145 C330,125 310,110 310,95 C310,80 322,70 335,70 C343,70 347,75 350,80 C353,75 357,70 365,70 C378,70 390,80 390,95 C390,110 370,125 350,145 Z"/>
  </svg>
</div>

<script>
  // Center transform origins for SVG shapes
  gsap.set("#heart", { transformOrigin: "50% 50%", scale: 0, opacity: 0 });

  const tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5 });

  tl
    // --- STAGE 1: Crush "LOVE" & "YO" -> Reveal "I ♥ U" ---
    .to("#barL", { x: 105, duration: 1, ease: "power2.inOut" }, 0.5)
    .to("#textI", { x: 105, duration: 1, ease: "power2.inOut" }, 0.5)
    .to("#rect-love", { x: 105, width: 0, duration: 1, ease: "power2.inOut" }, 0.5)

    .to("#barR", { x: -105, duration: 1, ease: "power2.inOut" }, 0.5)
    .to("#textU", { x: -105, duration: 1, ease: "power2.inOut" }, 0.5)
    .to("#rect-yo", { width: 0, duration: 1, ease: "power2.inOut" }, 0.5)

    .to("#heart", { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)" }, 1.3)

    // --- STAGE 2: Crush "I" and "U" -> Final Center Heart ---
    .to("#barL", { x: 235, duration: 0.8, ease: "power2.inOut" }, 2.5)
    .to("#textI", { x: 235, opacity: 0, duration: 0.8, ease: "power2.inOut" }, 2.5)

    .to("#barR", { x: -235, duration: 0.8, ease: "power2.inOut" }, 2.5)
    .to("#textU", { x: -235, opacity: 0, duration: 0.8, ease: "power2.inOut" }, 2.5)

    .to(["#barL", "#barR"], { opacity: 0, duration: 0.2 }, 3.1)
    .to("#heart", { scale: 2.2, duration: 0.6, ease: "back.out(2)" }, 3.1)

    // Pulse animation
    .to("#heart", { scale: 2.5, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, 3.7)
    .to({}, { duration: 1 });
</script>

</body>
</html>
