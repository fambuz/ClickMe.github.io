<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>I Love You</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #fceeb5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }
    .stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 600px;
      height: 200px;
    }
    .bar {
      width: 6px;
      height: 90px;
      background-color: #763c8c;
      border-radius: 4px;
      position: absolute;
      top: 55px;
      z-index: 5;
    }
    #barL { left: 40px; }
    #barR { right: 40px; }

    .content {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4.5rem;
      font-weight: 900;
      color: #763c8c;
      letter-spacing: 12px;
      z-index: 2;
    }

    .word-box {
      display: inline-flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
      vertical-align: middle;
    }

    .heart {
      display: inline-block;
      color: #fa4843;
      font-size: 5rem;
      width: 0px;
      opacity: 0;
      transform: scale(0);
      vertical-align: middle;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
</head>
<body>

<div class="stage">
  <div class="bar" id="barL"></div>

  <div class="content">
    <span id="charI">I</span>
    
    <!-- LOVE container that squishes shut -->
    <div class="word-box" id="boxLove">
      <span id="textLove">&nbsp;LOVE</span>
    </div>

    <!-- Center Heart -->
    <span class="heart" id="heart">♥</span>

    <!-- YOU container that squishes shut -->
    <div class="word-box" id="boxYou">
      <span id="textYou">&nbsp;YOU</span>
    </div>
    
    <span id="charU">U</span>
  </div>

  <div class="bar" id="barR"></div>
</div>

<script>
  const createAnimation = () => {
    const tl = anime.timeline({
      loop: true,
      autoplay: true
    });

    tl
    // ----------------------------------------------------
    // STEP 1: Squeeze "LOVE" out -> Reveal Heart ("I ♥ U")
    // ----------------------------------------------------
    .add({
      targets: '#barL',
      x: 125,
      duration: 900,
      easing: 'easeInOutQuint'
    }, 800)
    .add({
      targets: '#barR',
      x: -125,
      duration: 900,
      easing: 'easeInOutQuint'
    }, 800)
    .add({
      targets: '#boxLove',
      width: [180, 0],
      duration: 900,
      easing: 'easeInOutQuint'
    }, 800)
    .add({
      targets: '#textYou',
      x: [-120, 0],
      duration: 900,
      easing: 'easeInOutQuint'
    }, 800)
    .add({
      targets: '#heart',
      width: [0, 90],
      scale: [0, 1.2],
      opacity: [0, 1],
      duration: 500,
      easing: 'easeOutBack'
    }, 1400)

    // ----------------------------------------------------
    // STEP 2: Squeeze "I", "YOU", "U" -> Final Big Heart
    // ----------------------------------------------------
    .add({
      targets: '#barL',
      x: 255,
      duration: 800,
      easing: 'easeInOutQuint'
    }, 2800)
    .add({
      targets: '#barR',
      x: -255,
      duration: 800,
      easing: 'easeInOutQuint'
    }, 2800)
    .add({
      targets: '#boxYou',
      width: [140, 0],
      duration: 800,
      easing: 'easeInOutQuint'
    }, 2800)
    .add({
      targets: ['#charI', '#charU'],
      opacity: [1, 0],
      scale: [1, 0.2],
      duration: 500,
      easing: 'easeInQuad'
    }, 3000)
    .add({
      targets: ['#barL', '#barR'],
      opacity: [1, 0],
      duration: 200,
      easing: 'linear'
    }, 3400)

    // ----------------------------------------------------
    // STEP 3: Pop & Pulse Big Heart
    // ----------------------------------------------------
    .add({
      targets: '#heart',
      scale: [1.2, 2.8],
      duration: 500,
      easing: 'easeOutBack'
    }, 3400)
    .add({
      targets: '#heart',
      scale: 3.2,
      duration: 350,
      direction: 'alternate',
      loop: 2,
      easing: 'easeInOutSine'
    }, 3900)

    // Hold at the end before restarting
    .add({ duration: 1200 });
  };

  window.onload = createAnimation;
</script>

</body>
</html>
