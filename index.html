<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sophie</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #fceeb5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }
    .wrapper {
      position: relative;
      width: 800px;
      height: 250px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    svg {
      width: 100%;
      height: 100%;
    }
    .bar {
      fill: #763c8c;
    }
    .text-fill {
      fill: #763c8c;
      font-size: 56px;
      font-weight: 900;
      dominant-baseline: central;
    }
    .heart-fill {
      fill: #fa4843;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

<div class="wrapper">
  <svg viewBox="0 0 800 250">
    <defs>
      <!-- Clip path for collapsing "LOVE" -->
      <clipPath id="clip-love">
        <rect id="rect-love" x="240" y="0" width="160" height="250" />
      </clipPath>
      <!-- Clip path for collapsing "YO" -->
      <clipPath id="clip-yo">
        <rect id="rect-yo" x="400" y="0" width="160" height="250" />
      </clipPath>
    </defs>

    <!-- Side Bars (Adjusted right bar leftward) -->
    <rect id="barL" class="bar" x="140" y="80" width="6" height="90" rx="3" />
    <rect id="barR" class="bar" x="614" y="80" width="6" height="90" rx="3" />

    <!-- Static Anchors: I and U (Adjusted U starting position) -->
    <text id="textI" class="text-fill" x="175" y="125" text-anchor="start">I</text>
    <text id="textU" class="text-fill" x="585" y="125" text-anchor="end">U</text>

    <!-- Masked Collapsible Words -->
    <g clip-path="url(#clip-love)">
      <text id="textLove" class="text-fill" x="235" y="125" text-anchor="start">LOVE</text>
    </g>
    <g clip-path="url(#clip-yo)">
      <text id="textYo" class="text-fill" x="540" y="125" text-anchor="end">YO</text>
    </g>

    <!-- Center Heart -->
    <path id="heart" class="heart-fill" d="M400,145 C380,125 360,110 360,95 C360,80 372,70 385,70 C393,70 397,75 400,80 C403,75 407,70 415,70 C428,70 440,80 440,95 C440,110 420,125 400,145 Z"/>
  </svg>
</div>

<script>
  gsap.set("#heart", { transformOrigin: "50% 50%", scale: 0, opacity: 0 });

  const tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5 });

  tl
    // --- STAGE 1: Smooth Squeeze of "LOVE" & "YO" -> "I ❤ U" ---
    .to("#barL", { x: 95, duration: 1, ease: "power2.inOut" }, 0.6)
    .to("#textI", { x: 95, duration: 1, ease: "power2.inOut" }, 0.6)
    .to("#rect-love", { x: 95, width: 0, duration: 1, ease: "power2.inOut" }, 0.6)

    .to("#barR", { x: -55, duration: 1, ease: "power2.inOut" }, 0.6)
    .to("#textU", { x: -55, duration: 1, ease: "power2.inOut" }, 0.6)
    .to("#rect-yo", { width: 0, duration: 1, ease: "power2.inOut" }, 0.6)

    .to("#heart", { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)" }, 1.4)

    // --- STAGE 2: Squeeze "I" & "U" into center ---
    .to("#barL", { x: 220, duration: 0.8, ease: "power2.inOut" }, 2.6)
    .to("#textI", { x: 220, opacity: 0, duration: 0.8, ease: "power2.inOut" }, 2.6)

    .to("#barR", { x: -180, duration: 0.8, ease: "power2.inOut" }, 2.6)
    .to("#textU", { x: -180, opacity: 0, duration: 0.8, ease: "power2.inOut" }, 2.6)

    .to(["#barL", "#barR"], { opacity: 0, duration: 0.2 }, 3.2)
    .to("#heart", { scale: 2.2, duration: 0.6, ease: "back.out(2)" }, 3.2)

    // Pulse animation
    .to("#heart", { scale: 2.5, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, 3.8)
    .to({}, { duration: 1 });
</script>

</body>
</html>
