<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>I Love You </title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #fceeb5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .container {
      width: 600px;
      height: 250px;
      position: relative;
    }
    svg {
      width: 100%;
      height: 100%;
    }
    .line {
      stroke: #763c8c;
      stroke-width: 8;
      stroke-linecap: round;
    }
    .lttr {
      fill: #763c8c;
    }
    #heart {
      fill: #fa4843;
      transform-origin: center center;
      opacity: 0;
    }
  </style>
  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

<div class="container">
  <svg viewBox="0 0 500 200">
    <!-- Side Lines -->
    <line id="lineL" class="line" x1="20" y1="60" x2="20" y2="140" />
    <line id="lineR" class="line" x1="480" y1="60" x2="480" y2="140" />

    <!-- Center Heart (Hidden initially) -->
    <path id="heart" d="M250,115 C230,95 210,80 210,65 C210,50 222,40 235,40 C243,40 247,45 250,50 C253,45 257,40 265,40 C278,40 290,50 290,65 C290,80 270,95 250,115 Z"/>

    <!-- Letters -->
    <g id="letters">
      <!-- I -->
      <path class="lttr" id="lttr-i" d="M42.2,73.1v53.8h-8.4V73.1H42.2z"/>
      
      <!-- L O V E -->
      <g id="group-love">
        <path class="lttr" d="M85.1,73.1v46.1h25v7.7H76.7V73.1H85.1z"/>
        <path class="lttr" d="M123.9,100c0-15.2,11.7-26.9,27.2-26.9s27.2,11.7,27.2,26.9s-11.7,26.9-27.2,26.9S123.9,115.2,123.9,100z M166.9,100c0-9.2-6.8-16.5-15.8-16.5c-9,0-15.8,7.3-15.8,16.5s6.8,16.5,15.8,16.5C160.1,116.5,166.9,109.2,166.9,100z"/>
        <path class="lttr" d="M190.7,73.1h8.4l17.1,38.6l17.1-38.6h8.4l-21.3,47.7h-8.4L190.7,73.1z"/>
        <path class="lttr" d="M251.7,73.1h31.9v7.7h-23.5v15.3h21.1v7.7h-21.1v15.5h23.5v7.7h-31.9V73.1z"/>
      </g>

      <!-- Y O -->
      <g id="group-yo">
        <path class="lttr" d="M310.6,73.1h8.8l14.4,24.5l14.4-24.5h8.8l-18.8,31.7v22.1h-8.4v-22.1L310.6,73.1z"/>
        <path class="lttr" d="M348.8,100c0-15.2,11.7-26.9,27.2-26.9c15.5,0,27.2,11.7,27.2,26.9s-11.7,26.9-27.2,26.9C360.5,126.9,348.8,115.2,348.8,100z M391.8,100c0-9.2-6.8-16.5-15.8-16.5c-9,0-15.8,7.3-15.8,16.5s6.8,16.5,15.8,16.5C385,116.5,391.8,109.2,391.8,100z"/>
      </g>

      <!-- U -->
      <path class="lttr" id="lttr-u" d="M412.6,73.1h8.4v34.4c0,9,6.5,15.8,15.4,15.8c8.9,0,15.4-6.8,15.4-15.8V73.1h8.4v34.4c0,13.8-10.4,23.5-23.8,23.5c-13.4,0-23.8-9.7-23.8-23.5V73.1z"/>
    </g>
  </svg>
</div>

<script>
  const tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5 });

  tl.set('#heart', { scale: 0, opacity: 0, transformOrigin: '50% 50%' })
    
    // Step 1: Slide lines inwards to squeeze out LOVE
    .to('#lineL', { x: 165, duration: 1, ease: 'power2.inOut' }, 0)
    .to('#lttr-i', { x: 165, duration: 1, ease: 'power2.inOut' }, 0)
    .to('#group-love', { scaleX: 0, opacity: 0, duration: 0.8, ease: 'power2.in', transformOrigin: 'left center' }, 0.2)
    .to('#group-yo', { x: -75, duration: 1, ease: 'power2.inOut' }, 0)
    .to('#lttr-u', { x: -75, duration: 1, ease: 'power2.inOut' }, 0)
    .to('#lineR', { x: -75, duration: 1, ease: 'power2.inOut' }, 0)

    // Step 2: Squeeze out YO to leave I and U
    .to('#lineL', { x: 195, duration: 0.8, ease: 'power2.inOut' }, '+=0.2')
    .to('#lttr-i', { x: 195, duration: 0.8, ease: 'power2.inOut' }, '<')
    .to('#group-yo', { scaleX: 0, opacity: 0, duration: 0.6, ease: 'power2.in', transformOrigin: 'left center' }, '<')
    .to('#lttr-u', { x: -195, duration: 0.8, ease: 'power2.inOut' }, '<')
    .to('#lineR', { x: -195, duration: 0.8, ease: 'power2.inOut' }, '<')

    // Step 3: Crush I and U into the center line
    .to('#lineL', { x: 230, duration: 0.6, ease: 'power2.in' }, '+=0.2')
    .to('#lttr-i', { x: 230, opacity: 0, duration: 0.6, ease: 'power2.in' }, '<')
    .to('#lttr-u', { x: -230, opacity: 0, duration: 0.6, ease: 'power2.in' }, '<')
    .to('#lineR', { x: -230, duration: 0.6, ease: 'power2.in' }, '<')

    // Step 4: Heart Pop & Pulse
    .to('#lineL, #lineR', { opacity: 0, duration: 0.2 }, '+=0.1')
    .to('#heart', { opacity: 1, scale: 1.4, duration: 0.4, ease: 'back.out(2)' }, '<')
    .to('#heart', { scale: 1, duration: 0.3, ease: 'power1.inOut' })
    .to('#heart', { scale: 1.3, duration: 0.3, ease: 'power1.inOut', yoyo: true, repeat: 1 })
    
    // Hold then reset
    .to({}, { duration: 1 });
</script>

</body>
</html>
