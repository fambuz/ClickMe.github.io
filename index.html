<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>I Love You </title>
  <style>
    *, *:before, *:after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #fceeb5;
      font-family: sans-serif;
      overflow: hidden;
    }
    .container {
      width: 500px;
      height: 200px;
      position: relative;
    }
    .svg-container {
      z-index: 2;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .mo-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    .line {
      fill: none;
      stroke: #763c8c;
      stroke-width: 8;
      stroke-linecap: round;
      stroke-miterlimit: 10;
    }
    .lttr {
      fill: #763c8c;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@mojs/core"></script>
</head>
<body>

<div class="container">
  <div class="mo-container"></div>
  <svg class="svg-container" viewBox="0 0 500 200">
    <line class="line line--left" x1="10" y1="100" x2="10" y2="100"/>
    <line class="line line--rght" x1="490" y1="100" x2="490" y2="100"/>
    <g class="lttrs">
      <!-- I -->
      <path class="lttr lttr--I" d="M42.2,73.1v53.8h-8.4V73.1H42.2z"/>
      <!-- L -->
      <path class="lttr lttr--L" d="M85.1,73.1v46.1h25v7.7H76.7V73.1H85.1z"/>
      <!-- O -->
      <path class="lttr lttr--O" d="M123.9,100c0-15.2,11.7-26.9,27.2-26.9s27.2,11.7,27.2,26.9s-11.7,26.9-27.2,26.9S123.9,115.2,123.9,100z M166.9,100c0-9.2-6.8-16.5-15.8-16.5c-9,0-15.8,7.3-15.8,16.5s6.8,16.5,15.8,16.5C160.1,116.5,166.9,109.2,166.9,100z"/>
      <!-- V -->
      <path class="lttr lttr--V" d="M190.7,73.1h8.4l17.1,38.6l17.1-38.6h8.4l-21.3,47.7h-8.4L190.7,73.1z"/>
      <!-- E -->
      <path class="lttr lttr--E" d="M251.7,73.1h31.9v7.7h-23.5v15.3h21.1v7.7h-21.1v15.5h23.5v7.7h-31.9V73.1z"/>
      <!-- Y -->
      <path class="lttr lttr--Y" d="M310.6,73.1h8.8l14.4,24.5l14.4-24.5h8.8l-18.8,31.7v22.1h-8.4v-22.1L310.6,73.1z"/>
      <!-- O2 -->
      <path class="lttr lttr--O2" d="M348.8,100c0-15.2,11.7-26.9,27.2-26.9c15.5,0,27.2,11.7,27.2,26.9s-11.7,26.9-27.2,26.9C360.5,126.9,348.8,115.2,348.8,100z M391.8,100c0-9.2-6.8-16.5-15.8-16.5c-9,0-15.8,7.3-15.8,16.5s6.8,16.5,15.8,16.5C385,116.5,391.8,109.2,391.8,100z"/>
      <!-- U -->
      <path class="lttr lttr--U" d="M412.6,73.1h8.4v34.4c0,9,6.5,15.8,15.4,15.8c8.9,0,15.4-6.8,15.4-15.8V73.1h8.4v34.4c0,13.8-10.4,23.5-23.8,23.5c-13.4,0-23.8-9.7-23.8-23.5V73.1z"/>
    </g>
  </svg>
</div>

<script>
  const qs = document.querySelector.bind(document);

  const el = {
    container: qs('.mo-container'),
    i: qs('.lttr--I'),
    l: qs('.lttr--L'),
    o: qs('.lttr--O'),
    v: qs('.lttr--V'),
    e: qs('.lttr--E'),
    y: qs('.lttr--Y'),
    o2: qs('.lttr--O2'),
    u: qs('.lttr--U'),
    lineLeft: qs('.line--left'),
    lineRight: qs('.line--rght'),
    colTxt: "#763c8c",
    colHp: "#fa4843"
  };

  const move = 1000;
  const boom = 200;
  const easing = 'sin.inOut';
  const easingBoom = 'sin.in';
  const easingOut = 'sin.out';

  const opts = { duration: move, easing: easing, opacity: 1 };
  const delta = 150;

  // Custom Heart Shape for Mo.js
  class Heart extends mojs.CustomShape {
    getShape() {
      return '<path d="M50,88.9C25.5,70.2,9.3,54.4,9.3,35.1C9.3,19.2,21.9,6.7,37.7,6.7c9,0,17.5,4.2,23,10.8C66.2,10.9,74.7,6.7,83.7,6.7C99.5,6.7,112.1,19.2,112.1,35.1c0,19.3-16.2,35.1-40.7,53.8L50,88.9z"/>';
    }
  }
  mojs.addShape('heart', Heart);

  const crtLvl1 = () => {
    return new mojs.Timeline().add([
      // Move Side Lines Inward
      new mojs.Html({
        ...opts,
        el: el.lineLeft,
        x: { 0: delta },
        strokeDasharray: { '0 100': '100 0' }
      }),
      new mojs.Html({
        ...opts,
        el: el.lineRight,
        x: { 0: -delta },
        strokeDasharray: { '0 100': '100 0' }
      }),

      // Compress Letters
      new mojs.Html({ ...opts, el: el.i, x: { 0: delta } }),
      new mojs.Html({ ...opts, el: el.l, x: { 0: delta } }),
      new mojs.Html({ ...opts, el: el.o, x: { 0: delta } }),
      new mojs.Html({ ...opts, el: el.v, x: { 0: delta } }),
      new mojs.Html({ ...opts, el: el.e, x: { 0: delta } }),
      new mojs.Html({ ...opts, el: el.y, x: { 0: -delta } }),
      new mojs.Html({ ...opts, el: el.o2, x: { 0: -delta } }),
      new mojs.Html({ ...opts, el: el.u, x: { 0: -delta } }),
    ]).then({
      onStart: () => {
        [el.l, el.o, el.v, el.e].forEach(e => e.style.opacity = 0);
      }
    });
  };

  const crtLvl2 = () => {
    return new mojs.Timeline().add([
      new mojs.Html({
        duration: move,
        easing: easing,
        el: el.lineLeft,
        x: { [delta]: delta + 60 }
      }),
      new mojs.Html({
        duration: move,
        easing: easing,
        el: el.lineRight,
        x: { [-delta]: -delta - 60 }
      }),
      new mojs.Html({ duration: move, easing: easing, el: el.i, x: { [delta]: delta + 60 } }),
      new mojs.Html({ duration: move, easing: easing, el: el.u, x: { [-delta]: -delta - 60 } }),
    ]).then({
      onStart: () => {
        [el.y, el.o2].forEach(e => e.style.opacity = 0);
      }
    });
  };

  const crtHeart = () => {
    return new mojs.Shape({
      parent: el.container,
      shape: 'heart',
      fill: el.colHp,
      scale: { 0: 1 },
      duration: boom,
      easing: easingOut
    });
  };

  const crtBurst = () => {
    return new mojs.Burst({
      parent: el.container,
      radius: { 0: 100 },
      count: 10,
      children: {
        shape: 'heart',
        fill: [el.colTxt, el.colHp],
        duration: 800,
        easing: 'quad.out'
      }
    });
  };

  // Master Sequence
  const masterTimeline = new mojs.Timeline({ repeat: 999, delay: 500 });

  masterTimeline
    .add(crtLvl1())
    .append(crtLvl2())
    .append(crtHeart())
    .append(crtBurst());

  masterTimeline.play();
</script>

</body>
</html>
